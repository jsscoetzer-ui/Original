name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-test-apk.yml'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        run: |
          mkdir -p source
          cat ci/project.b64.* | base64 --decode > source.zip
          unzip -q source.zip -d source
          test -f source/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' source/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' source/app/build.gradle.kts
          grep -E 'compileSdk|targetSdk' source/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/app/build/outputs/apk/debug/app-debug.apk
          sha256sum source/app/build/outputs/apk/debug/app-debug.apk | tee source/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Originals-v0.1-test-apk
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
