name: Build test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-test-apk.yml'
      - 'ci/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android source
        run: |
          mkdir -p source
          cat ci/project.b64.* | base64 --decode > source.zip
          unzip -q source.zip -d source
          test -f source/settings.gradle.kts
          sed -i 's/id("com.android.application") version "9.4.0"/id("com.android.application") version "8.13.2"/' source/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' source/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' source/app/build.gradle.kts
          sed -i 's/versionName = "0.1.0"/versionName = "0.1.1"/' source/app/build.gradle.kts
          sed -i 's/io.github.tdlibx:td-android:1.8.56-RC10/com.github.tdlibx:td:1.8.56/' source/app/build.gradle.kts
          sed -i 's/androidx.compose:compose-bom:2026.08.00/androidx.compose:compose-bom:2025.12.00/' source/app/build.gradle.kts
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.11.0/' source/app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4/' source/app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0/androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4/' source/app/build.gradle.kts
          sed -i '/android.builtInKotlin=false/d' source/gradle.properties
          sed -i '/android.newDsl=false/d' source/gradle.properties
          python3 - <<'PY'
          from pathlib import Path

          p = Path('source/app/build.gradle.kts')
          s = p.read_text()
          if 'import org.jetbrains.kotlin.gradle.dsl.JvmTarget' not in s:
              s = 'import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n' + s
          s = s.replace('    kotlinOptions {\n        jvmTarget = "17"\n    }\n', '')
          if '\nkotlin {\n    compilerOptions {' not in s:
              s = s.replace('\ndependencies {\n', '\nkotlin {\n    compilerOptions {\n        jvmTarget.set(JvmTarget.JVM_17)\n    }\n}\n\ndependencies {\n')
          if 'resolutionStrategy.force(' not in s:
              s = s.replace('\ndependencies {\n', '\nconfigurations.all {\n    resolutionStrategy.force(\n        "androidx.core:core:1.17.0",\n        "androidx.core:core-ktx:1.17.0"\n    )\n}\n\ndependencies {\n')
          p.write_text(s)

          settings = Path('source/settings.gradle.kts')
          y = settings.read_text()
          if 'https://jitpack.io' not in y:
              marker = 'dependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n'
              replacement = marker + '        maven { url = uri("https://jitpack.io") }\n'
              if marker not in y:
                  raise SystemExit('Could not locate dependency repositories block')
              y = y.replace(marker, replacement, 1)
          settings.write_text(y)

          h = Path('source/app/src/main/java/za/co/originals/app/Hashing.kt')
          hs = h.read_text()
          hs = hs.replace('longArrayOf(10, 50, 90).mapNotNull { pct ->', 'listOf(10L, 50L, 90L).mapNotNull { pct ->')
          h.write_text(hs)

          scanner = Path('source/app/src/main/java/za/co/originals/app/TelegramScanner.kt')
          scanner.write_text(r'''package za.co.originals.app

import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import kotlinx.coroutines.withTimeoutOrNull
import org.drinkless.tdlib.TdApi
import java.io.File

class TelegramScanner(private val td: TelegramClientManager) {
    suspend fun scan(
        options: ScanOptions,
        onProgress: (String, Int, Int) -> Unit
    ): List<MediaAsset> = withContext(Dispatchers.IO) {
        onProgress("Loading Telegram chats…", 0, 0)
        val chatIds = loadAllChatIds(options.includeArchivedChats) { batch ->
            onProgress("Loading Telegram chats… batch $batch", 0, 0)
        }
        val found = mutableListOf<MediaAsset>()
        if (chatIds.isEmpty()) {
            onProgress("No Telegram chats found", 0, 0)
            return@withContext found
        }

        chatIds.forEachIndexed { index, chatId ->
            val chat = runCatching { td.send(TdApi.GetChat(chatId)) }.getOrNull()
            val title = chat?.title ?: "Telegram chat"
            fun progress(detail: String) {
                onProgress("$title · $detail", index + 1, chatIds.size)
            }
            progress("${found.size} media found · opening chat")
            scanChat(chatId, options, found, ::progress)
        }
        found
    }

    private suspend fun loadAllChatIds(includeArchive: Boolean, onBatch: (Int) -> Unit): List<Long> {
        loadList(null, onBatch)
        val ids = linkedSetOf<Long>()
        runCatching { td.send(TdApi.GetChats(null, 10_000)) }.getOrNull()?.chatIds?.forEach { ids.add(it) }
        if (includeArchive) {
            val archive = TdApi.ChatListArchive()
            loadList(archive, onBatch)
            runCatching { td.send(TdApi.GetChats(archive, 10_000)) }.getOrNull()?.chatIds?.forEach { ids.add(it) }
        }
        return ids.toList()
    }

    private suspend fun loadList(list: TdApi.ChatList?, onBatch: (Int) -> Unit) {
        repeat(100) { batch ->
            onBatch(batch + 1)
            val result = runCatching { td.send(TdApi.LoadChats(list, 100)) }
            if (result.isFailure) return
        }
    }

    private suspend fun scanChat(
        chatId: Long,
        options: ScanOptions,
        out: MutableList<MediaAsset>,
        onDetail: (String) -> Unit
    ) {
        var fromMessageId = 0L
        var previousLast = Long.MIN_VALUE
        var messagesChecked = 0
        while (true) {
            val page = runCatching { td.send(TdApi.GetChatHistory(chatId, fromMessageId, 0, 100, false)) }.getOrElse { return }
            if (page.messages.isEmpty()) return
            messagesChecked += page.messages.size
            onDetail("${out.size} media found · $messagesChecked messages checked")

            for (message in page.messages) {
                if (options.onlySentByMe && !message.isOutgoing) continue
                val descriptor = mediaDescriptor(message, options) ?: continue
                val shortName = descriptor.name.ifBlank { "Telegram media" }.take(42)

                val readyFile = descriptor.file.takeIf {
                    it.local.isDownloadingCompleted && it.local.path.isNotBlank() && File(it.local.path).exists()
                }
                val downloaded = readyFile ?: run {
                    onDetail("${out.size} media found · downloading $shortName")
                    val result = try {
                        withTimeoutOrNull(45_000L) {
                            td.send(TdApi.DownloadFile(descriptor.file.id, 32, 0, 0, true))
                        }
                    } catch (_: Throwable) {
                        null
                    }
                    if (result == null) {
                        try {
                            withTimeoutOrNull(3_000L) {
                                td.send(TdApi.CancelDownloadFile(descriptor.file.id, false))
                            }
                        } catch (_: Throwable) {
                            // Best effort only. A slow/unavailable file must not stop the scan.
                        }
                        onDetail("${out.size} media found · skipped slow/unavailable file")
                    }
                    result
                } ?: continue

                val path = downloaded.local.path
                if (!downloaded.local.isDownloadingCompleted || path.isBlank() || !File(path).exists()) {
                    onDetail("${out.size} media found · skipped unavailable file")
                    continue
                }

                out += MediaAsset(
                    id = "tg:${message.chatId}:${message.id}:${descriptor.file.id}",
                    source = MediaSource.TELEGRAM,
                    kind = descriptor.kind,
                    displayName = descriptor.name.ifBlank { File(path).name },
                    mimeType = descriptor.mimeType,
                    sizeBytes = File(path).length().takeIf { it > 0 } ?: downloaded.size,
                    width = descriptor.width,
                    height = descriptor.height,
                    durationMs = descriptor.durationMs,
                    timestampSeconds = message.date.toLong(),
                    localPath = path,
                    telegramChatId = message.chatId,
                    telegramMessageId = message.id
                )
                onDetail("${out.size} media found · $messagesChecked messages checked")
            }
            val last = page.messages.last().id
            if (last == previousLast || last == 0L) return
            previousLast = last
            fromMessageId = last
        }
    }

    private data class Descriptor(
        val kind: MediaKind,
        val file: TdApi.File,
        val name: String,
        val mimeType: String?,
        val width: Int,
        val height: Int,
        val durationMs: Long
    )

    private fun mediaDescriptor(message: TdApi.Message, options: ScanOptions): Descriptor? = when (val c = message.content) {
        is TdApi.MessagePhoto -> if (options.includeImages) {
            val best = c.photo.sizes.maxByOrNull { it.width.toLong() * it.height.toLong() } ?: return null
            Descriptor(MediaKind.IMAGE, best.photo, "telegram_${message.id}.jpg", "image/jpeg", best.width, best.height, 0)
        } else null

        is TdApi.MessageVideo -> if (options.includeVideos) {
            Descriptor(MediaKind.VIDEO, c.video.video, c.video.fileName, c.video.mimeType, c.video.width, c.video.height, c.video.duration * 1000L)
        } else null

        is TdApi.MessageVideoNote -> if (options.includeVideos) {
            Descriptor(MediaKind.VIDEO, c.videoNote.video, "video_note_${message.id}.mp4", "video/mp4", c.videoNote.length, c.videoNote.length, c.videoNote.duration * 1000L)
        } else null

        is TdApi.MessageDocument -> {
            val mime = c.document.mimeType
            when {
                options.includeImages && mime.startsWith("image/") -> Descriptor(
                    MediaKind.IMAGE, c.document.document, c.document.fileName, mime, 0, 0, 0
                )
                options.includeVideos && mime.startsWith("video/") -> Descriptor(
                    MediaKind.VIDEO, c.document.document, c.document.fileName, mime, 0, 0, 0
                )
                else -> null
            }
        }
        else -> null
    }
}
''')

          m = Path('source/app/src/main/AndroidManifest.xml')
          x = m.read_text()
          x = x.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">')
          x = x.replace('android:usesCleartextTraffic="false">', 'android:usesCleartextTraffic="false"\n        tools:replace="android:allowBackup,android:label">')
          m.write_text(x)
          PY
          grep 'com.android.application' source/build.gradle.kts
          grep -E 'compileSdk|targetSdk|versionName|jvmTarget|com.github.tdlibx:td|compose-bom|activity-compose|lifecycle-viewmodel|androidx.core' source/app/build.gradle.kts
          grep -n 'jitpack.io' source/settings.gradle.kts
          grep -n 'withTimeoutOrNull\|skipped slow' source/app/src/main/java/za/co/originals/app/TelegramScanner.kt
          grep -E 'xmlns:tools|tools:replace' source/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/app/build/outputs/apk/debug/app-debug.apk
          sha256sum source/app/build/outputs/apk/debug/app-debug.apk | tee source/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Originals-v0.1.1-test-apk
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
