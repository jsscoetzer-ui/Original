name: Dirty Studio PixRestore Worker

on:
  workflow_dispatch:
  push:
    branches: [dirty-studio-wow-v1-clean]
    paths:
      - 'dirty-studio-wow-v1/worker/**'
      - '.github/workflows/dirty-studio-pixrestore.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/jsscoetzer-ui/dirty-studio-pixrestore
          tags: |
            type=raw,value=wow-v1
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: dirty-studio-wow-v1/worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/jsscoetzer-ui/Original
          cache-from: type=gha
          cache-to: type=gha,mode=max
